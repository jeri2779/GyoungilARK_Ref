.btn:not(:disabled):hover {

  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

.form-switch .form-check-input {

.form-switch .form-check-input::before {

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range {

.form-range::-webkit-slider-runnable-track {

.btn:not(.btn-primary, .viz-tile):is(

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;combat-map-editor&quot;&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;전투 구역 편집 도구&quot;&gt;
    &lt;div class=&quot;viz-row&quot; role=&quot;group&quot; aria-label=&quot;모듈 선택&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-module=&quot;A&quot; aria-pressed=&quot;true&quot;&gt;Module A&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-module=&quot;B&quot; aria-pressed=&quot;false&quot;&gt;Module B&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-module=&quot;C&quot; aria-pressed=&quot;false&quot;&gt;Module C&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-module=&quot;D&quot; aria-pressed=&quot;false&quot;&gt;Module D&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-module=&quot;E&quot; aria-pressed=&quot;false&quot;&gt;Module E&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-module=&quot;F&quot; aria-pressed=&quot;false&quot;&gt;Module F&lt;/button&gt;

    &lt;label class=&quot;form-label&quot; for=&quot;combat-brush&quot;&gt;

        &lt;option value=&quot;high&quot;&gt;고지&lt;/option&gt;

    &lt;button id=&quot;combat-save&quot; type=&quot;button&quot; class=&quot;btn&quot;&gt;설계 저장&lt;/button&gt;

  &lt;div class=&quot;viz-row combat-summary&quot;&gt;
    &lt;span id=&quot;combat-name&quot; class=&quot;viz-badge&quot;&gt;Module A · 전투 14×6&lt;/span&gt;
    &lt;span id=&quot;combat-route&quot; aria-live=&quot;polite&quot;&gt;경로 계산 중&lt;/span&gt;
    &lt;span id=&quot;combat-cell&quot; class=&quot;text-muted&quot;&gt;외곽 1줄은 장식으로 고정&lt;/span&gt;
  &lt;/div&gt;

  &lt;div id=&quot;combat-grid&quot; class=&quot;combat-grid&quot; role=&quot;grid&quot; aria-label=&quot;Module A 전투 구역 편집판&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;viz-row combat-legend text-small&quot; aria-label=&quot;타일 범례&quot;&gt;
    &lt;span&gt;&lt;b&gt;장&lt;/b&gt; 고정 장식&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;지&lt;/b&gt; 지상&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;고&lt;/b&gt; 고지&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;S&lt;/b&gt; 스폰&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;I&lt;/b&gt; 입구&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;O&lt;/b&gt; 출구&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;C&lt;/b&gt; 코어&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;·&lt;/b&gt; 비움&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;●&lt;/b&gt; 계산 경로&lt;/span&gt;
  &lt;/div&gt;

&lt;style&gt;
  #combat-map-editor {
    color: var(--foreground);
    width: 100%;
  }

  #combat-map-editor .combat-summary {
    justify-content: flex-start;
    margin-bottom: 10px;
  }

  #combat-map-editor .combat-grid {
    display: grid;
    grid-template-columns: repeat(16, minmax(0, 1fr));
    gap: 3px;
    width: 100%;
    touch-action: none;
    user-select: none;
  }

  #combat-map-editor .combat-cell {
    aspect-ratio: 1;
    min-width: 0;
  }

  #combat-map-editor .combat-cell[data-type=&quot;decor&quot;] {
    color: var(--muted-foreground);
    background: color-mix(in srgb, var(--muted) 72%, transparent);
  }

  #combat-map-editor .combat-cell[data-type=&quot;empty&quot;] {
    color: var(--muted-foreground);
    background: color-mix(in srgb, var(--muted) 28%, transparent);
  }

  #combat-map-editor .combat-cell[data-type=&quot;ground&quot;] {
    color: var(--foreground);
    background: color-mix(in srgb, var(--viz-series-1) 14%, transparent);
  }

  #combat-map-editor .combat-cell[data-type=&quot;high&quot;] {
    color: var(--foreground);
    background: color-mix(in srgb, var(--viz-series-3) 22%, transparent);
  }

  #combat-map-editor .combat-cell[data-type=&quot;spawn&quot;],
  #combat-map-editor .combat-cell[data-type=&quot;entry&quot;] {
    color: var(--foreground);
    background: color-mix(in srgb, var(--viz-series-4) 24%, transparent);
  }

  #combat-map-editor .combat-cell[data-type=&quot;exit&quot;],
  #combat-map-editor .combat-cell[data-type=&quot;core&quot;] {
    color: var(--foreground);
    background: color-mix(in srgb, var(--viz-series-2) 24%, transparent);
  }

  #combat-map-editor .combat-cell.is-route {
    box-shadow: inset 0 0 0 3px var(--viz-series-1);
  }

  #combat-map-editor .combat-legend {
    justify-content: center;
    margin-top: 10px;
  }

  #combat-map-editor .combat-legend b {
    color: var(--foreground);
    font-weight: 500;
  }

  @media (max-width: 520px) {
    #combat-map-editor .combat-grid {
      gap: 1px;
    }
  }
&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;combat-map-editor&quot;);
    const grid = root.querySelector(&quot;#combat-grid&quot;);
    const brush = root.querySelector(&quot;#combat-brush&quot;);
    const nameLabel = root.querySelector(&quot;#combat-name&quot;);
    const routeLabel = root.querySelector(&quot;#combat-route&quot;);
    const cellLabel = root.querySelector(&quot;#combat-cell&quot;);
    const save = root.querySelector(&quot;#combat-save&quot;);
    const load = root.querySelector(&quot;#combat-load&quot;);
    const moduleButtons = Array.from(root.querySelectorAll(&quot;[data-module]&quot;));

    const cols = 16;
    const rows = 8;
    const typeInfo = {
      decor: { label: &quot;고정 장식&quot;, mark: &quot;장&quot;, walkable: false },
      empty: { label: &quot;비움&quot;, mark: &quot;·&quot;, walkable: false },
      ground: { label: &quot;지상&quot;, mark: &quot;지&quot;, walkable: true },
      high: { label: &quot;고지&quot;, mark: &quot;고&quot;, walkable: false },
      spawn: { label: &quot;스폰&quot;, mark: &quot;S&quot;, walkable: true },
      entry: { label: &quot;게이트 입구&quot;, mark: &quot;I&quot;, walkable: true },
      exit: { label: &quot;게이트 출구&quot;, mark: &quot;O&quot;, walkable: true },
      core: { label: &quot;코어&quot;, mark: &quot;C&quot;, walkable: true }
    };
    const codeType = {
      G: &quot;ground&quot;,
      H: &quot;high&quot;,
      S: &quot;spawn&quot;,
      I: &quot;entry&quot;,
      O: &quot;exit&quot;,
      C: &quot;core&quot;,
      E: &quot;empty&quot;
    };
    const patterns = {
      A: [
        &quot;GGGGHHHGGGGSHS&quot;,
        &quot;GGHGHHHGGGGGGG&quot;,
        &quot;GGHGHHGGHGGHHG&quot;,
        &quot;GGHGHGGGGGGHHG&quot;,
        &quot;GGHGGGHGGGHGGS&quot;,
        &quot;CGHGGGHGGSGGGS&quot;
      ],
      B: [
        &quot;GGGGHGGGHGGSHS&quot;,
        &quot;GGGGHGGGHGGGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGGGHGGGHGGG&quot;,
        &quot;CGHGGGHGGGHGGG&quot;
      ],
      C: [
        &quot;GGGGHGGGHGGGHS&quot;,
        &quot;GGGGHGGGHGGGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGGGHGGGHGGG&quot;,
        &quot;CGHGGGHGGGHGGG&quot;
      ],
      D: [
        &quot;GGGGHGGGHGGGHS&quot;,
        &quot;GGGGHGGGHGGGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGHGHGHGHGHG&quot;,
        &quot;GGHGGGHGGGHGGG&quot;,
        &quot;CGHGGGHGGGHGGG&quot;
      ],
      E: [
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;
      ],
      F: [
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;,
        &quot;GGGGGGGGGGGGGG&quot;
      ]
    };

    const moduleNames = [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;E&quot;, &quot;F&quot;];

    let activeModule = &quot;A&quot;;
    let drawing = false;
    let routeCells = new Set();

    function isBorder(x, y) {
      return x === 0 || x === cols - 1 || y === 0 || y === rows - 1;
    }

    function makeMap(pattern) {
      const map = [];

      for (let y = 0; y &lt; rows; y += 1) {
        const row = [];

        for (let x = 0; x &lt; cols; x += 1) {
          if (isBorder(x, y)) {
            row.push(&quot;decor&quot;);
            continue;
          }

          const code = pattern[y - 1][x - 1];
          row.push(codeType[code]);
        }

        map.push(row);
      }

      return map;
    }

    const maps = Object.fromEntries(
      moduleNames.map((name) =&gt; [name, makeMap(patterns[name])])
    );

    function cellKey(x, y) {
      return x + &quot;,&quot; + y;
    }

    function mapCoord(x, y) {
      return {
        col: x + 7,
        row: 7 - y
      };
    }

    function getCells(map, types) {
      const cells = [];

      for (let y = 1; y &lt; rows - 1; y += 1) {
        for (let x = 1; x &lt; cols - 1; x += 1) {
          if (types.includes(map[y][x])) {
            cells.push({ x, y });
          }
        }
      }

      return cells;
    }

    function buildPath(map, start, goal) {
      const queue = [start];
      const seen = new Set([cellKey(start.x, start.y)]);
      const parent = new Map();
      const moves = [
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 },
        { x: 0, y: -1 }
      ];

      for (let index = 0; index &lt; queue.length; index += 1) {
        const current = queue[index];

        if (current.x === goal.x &amp;&amp; current.y === goal.y) {
          const path = [];
          let cursor = cellKey(goal.x, goal.y);

          while (cursor) {
            path.push(cursor);
            cursor = parent.get(cursor);
          }

          return path;
        }

        moves.forEach((move) =&gt; {
          const nextX = current.x + move.x;
          const nextY = current.y + move.y;
          const nextKey = cellKey(nextX, nextY);
          const inside = nextX &gt; 0 &amp;&amp; nextX &lt; cols - 1 &amp;&amp; nextY &gt; 0 &amp;&amp; nextY &lt; rows - 1;

          if (!inside) {
            return;
          }

          if (seen.has(nextKey)) {
            return;
          }

          if (!typeInfo[map[nextY][nextX]].walkable) {
            return;
          }

          seen.add(nextKey);
          parent.set(nextKey, cellKey(current.x, current.y));
          queue.push({ x: nextX, y: nextY });
        });
      }

      return [];
    }

    function getRoutes(map) {
      const starts = getCells(map, [&quot;spawn&quot;, &quot;entry&quot;]);
      const goals = getCells(map, [&quot;exit&quot;, &quot;core&quot;]);
      const cells = new Set();
      let connected = 0;
      let required = 0;

      starts.forEach((start) =&gt; {
        goals.forEach((goal) =&gt; {
          required += 1;
          const path = buildPath(map, start, goal);

          if (path.length === 0) {
            return;
          }

          connected += 1;
          path.forEach((item) =&gt; {
            cells.add(item);
          });
        });
      });

      return {
        cells,
        connected,
        required,
        starts: starts.length,
        goals: goals.length
      };
    }

    function showRoutes(result) {
      routeCells = result.cells;

      if (result.starts === 0 || result.goals === 0) {
        routeLabel.textContent = &quot;스폰·입구와 출구·코어가 필요합니다&quot;;
        return;
      }

      if (result.connected === result.required) {
        routeLabel.textContent = &quot;모든 경로 연결 · &quot; + result.cells.size + &quot;칸&quot;;
        return;
      }

      routeLabel.textContent = &quot;연결 &quot; + result.connected + &quot;/&quot; + result.required + &quot; · 끊긴 경로 있음&quot;;
    }

    function cellMark(type, x, y) {
      const special = [&quot;spawn&quot;, &quot;entry&quot;, &quot;exit&quot;, &quot;core&quot;];

      if (routeCells.has(cellKey(x, y)) &amp;&amp; !special.includes(type)) {
        return &quot;●&quot;;
      }

      return typeInfo[type].mark;
    }

    function updateMap() {
      const result = getRoutes(maps[activeModule]);
      showRoutes(result);
      renderGrid();
    }

    function editCell(x, y) {
      if (isBorder(x, y)) {
        return;
      }

      maps[activeModule][y][x] = brush.value;
      const coord = mapCoord(x, y);
      cellLabel.textContent =
        &quot;Col &quot; + coord.col + &quot; · Row &quot; + coord.row + &quot; · &quot; + typeInfo[brush.value].label;
      updateMap();
    }

    function renderGrid() {
      const map = maps[activeModule];
      grid.replaceChildren();
      grid.setAttribute(&quot;aria-label&quot;, &quot;Module &quot; + activeModule + &quot; 전투 구역 편집판&quot;);

      for (let y = 0; y &lt; rows; y += 1) {
        for (let x = 0; x &lt; cols; x += 1) {
          const type = map[y][x];
          const cell = document.createElement(&quot;button&quot;);
          const border = isBorder(x, y);
          const route = routeCells.has(cellKey(x, y));

          cell.type = &quot;button&quot;;
          cell.className = &quot;btn viz-tile combat-cell&quot;;
          cell.dataset.type = type;
          cell.setAttribute(&quot;role&quot;, &quot;gridcell&quot;);
          cell.textContent = cellMark(type, x, y);

          if (border) {
            cell.disabled = true;
            cell.setAttribute(&quot;aria-label&quot;, &quot;고정 장식&quot;);
          }
          else {
            const coord = mapCoord(x, y);
            let routeText = &quot;&quot;;

            if (route) {
              routeText = &quot;, 계산 경로&quot;;
              cell.classList.add(&quot;is-route&quot;);
            }

            cell.setAttribute(
              &quot;aria-label&quot;,
              &quot;Col &quot; + coord.col + &quot;, Row &quot; + coord.row + &quot;, &quot; + typeInfo[type].label + routeText
            );

            cell.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
              if (event.button !== 0) {
                return;
              }

              event.preventDefault();
              drawing = true;
              editCell(x, y);
            });

            cell.addEventListener(&quot;pointerenter&quot;, (event) =&gt; {
              const leftDown = (event.buttons &amp; 1) === 1;

              if (!leftDown) {
                drawing = false;
                return;
              }

              if (!drawing) {
                return;
              }

              editCell(x, y);
            });

            cell.addEventListener(&quot;click&quot;, (event) =&gt; {
              if (event.detail !== 0) {
                return;
              }

              editCell(x, y);
            });
          }

          grid.appendChild(cell);
        }
      }
    }

    function selectModule(moduleName) {
      activeModule = moduleName;
      nameLabel.textContent = &quot;Module &quot; + activeModule + &quot; · 전투 14×6&quot;;

      moduleButtons.forEach((button) =&gt; {
        const selected = button.dataset.module === activeModule;
        button.classList.toggle(&quot;btn-primary&quot;, selected);
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      });

      cellLabel.textContent = &quot;외곽 1줄은 장식으로 고정&quot;;
      updateMap();
    }

    function layoutText(moduleName) {
      const codes = {
        empty: &quot;E&quot;,
        ground: &quot;G&quot;,
        high: &quot;H&quot;,
        spawn: &quot;S&quot;,
        entry: &quot;I&quot;,
        exit: &quot;O&quot;,
        core: &quot;C&quot;
      };
      const output = [];

      for (let y = 1; y &lt; rows - 1; y += 1) {
        let line = &quot;&quot;;

        for (let x = 1; x &lt; cols - 1; x += 1) {
          line += codes[maps[moduleName][y][x]];
        }

        output.push(line);
      }

      return output.join(&quot;\n&quot;);
    }

    function getData() {
      const savedMaps = {};

      moduleNames.forEach((name) =&gt; {
        savedMaps[name] = layoutText(name).split(&quot;\n&quot;);
      });

      return {
        version: 2,
        width: 14,
        height: 6,
        moduleCount: moduleNames.length,
        order: &quot;Row 6 to Row 1&quot;,
        maps: savedMaps
      };
    }

    function validData(data) {
      if (!data || !data.maps) {
        return false;
      }

      const legacyRequired = [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;D&quot;];
      const codes = new Set([&quot;G&quot;, &quot;H&quot;, &quot;E&quot;, &quot;S&quot;, &quot;I&quot;, &quot;O&quot;, &quot;C&quot;]);

      for (const name of legacyRequired) {
        if (!data.maps[name]) {
          return false;
        }
      }

      for (const name of moduleNames) {
        const lines = data.maps[name];

        if (!lines) {
          continue;
        }

        if (!Array.isArray(lines) || lines.length !== 6) {
          return false;
        }

        for (const line of lines) {
          if (typeof line !== &quot;string&quot; || line.length !== 14) {
            return false;
          }

          for (const code of line) {
            if (!codes.has(code)) {
              return false;
            }
          }
        }
      }

      return true;
    }

    function applyData(data) {
      moduleNames.forEach((name) =&gt; {
        const source = data.maps[name] || patterns[name];

        for (let y = 1; y &lt; rows - 1; y += 1) {
          for (let x = 1; x &lt; cols - 1; x += 1) {
            const code = source[y - 1][x - 1];
            maps[name][y][x] = codeType[code];
          }
        }
      });
    }

    moduleButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        selectModule(button.dataset.module);
      });
    });

    window.addEventListener(&quot;pointerup&quot;, () =&gt; {
      drawing = false;
    });

    window.addEventListener(&quot;pointercancel&quot;, () =&gt; {
      drawing = false;
    });

    window.addEventListener(&quot;blur&quot;, () =&gt; {
      drawing = false;
    });

    save.addEventListener(&quot;click&quot;, () =&gt; {
      const content = JSON.stringify(getData(), null, 2);
      const blob = new Blob([content], { type: &quot;application/json&quot; });
      const url = URL.createObjectURL(blob);
      const link = document.createElement(&quot;a&quot;);

      link.href = url;
      link.download = &quot;combat-map-layout.json&quot;;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() =&gt; {
        URL.revokeObjectURL(url);
      }, 0);
      cellLabel.textContent = &quot;A~F 설계를 JSON으로 저장했습니다&quot;;
    });

    load.addEventListener(&quot;change&quot;, async () =&gt; {
      const file = load.files[0];

      if (!file) {
        return;
      }

      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (!validData(data)) {
          cellLabel.textContent = &quot;지원하지 않는 설계 형식입니다&quot;;
          return;
        }

        const legacyFile = !data.maps.E || !data.maps.F;
        applyData(data);
        cellLabel.textContent = legacyFile
          ? &quot;구버전 A~D 설계를 불러왔습니다 · E/F는 기본 맵으로 생성했습니다&quot;
          : &quot;A~F 설계를 불러왔습니다&quot;;
        updateMap();
      }
      catch (error) {
        cellLabel.textContent = &quot;설계 파일을 읽지 못했습니다&quot;;
      }
      finally {
        load.value = &quot;&quot;;
      }
    });

    updateMap();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
